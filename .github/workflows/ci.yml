name: Kinefy CI Workflow

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Backend Setup
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install Backend Dependencies
      run: |
        cd kinefy-backend
        npm ci || npm install
        
    # Frontend Setup & Build
    - name: Install Frontend Dependencies
      run: |
        cd kinefy-frontend
        npm ci || npm install
        
    - name: Build Frontend
      run: |
        cd kinefy-frontend
        npm run build
        
    # Aquí irían los tests en el futuro (npm test)
    - name: Run Tests (Placeholder)
      run: echo "Tests pasados correctamente (Simulado para MVP)"
