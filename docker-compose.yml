version: '3.8'

services:
  # Base de Datos (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: kinefy-db
    volumes:
      - mongo-data:/data/db
    networks:
      - kinefy-network

  # Backend (API)
  backend:
    build: ./kinefy-backend
    container_name: kinefy-api
    environment:
      - MONGO_URI=mongodb://mongodb:27017/kinefy
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - NODE_ENV=production

    depends_on:
      - mongodb
    networks:
      - kinefy-network

  # Frontend (Nginx)
  frontend:
    build: ./kinefy-frontend
    container_name: kinefy-web
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kinefy-network

networks:
  kinefy-network:
    driver: bridge

volumes:
  mongo-data:
